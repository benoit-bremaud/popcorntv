[project]
name = "popcorntv-infrastructure"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[dependency-groups]
ci = ["pytest==9.0.2", "pytest-cov==7.0.0", "mypy==2.4.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["scripts/tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
