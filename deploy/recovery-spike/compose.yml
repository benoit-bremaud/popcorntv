# Stage-2 synthetic peer experiment only. No Internet-facing downloads and no VPN credentials.
name: popcorntv-recovery-spike

x-client: &client
  image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
  user: '${SPIKE_UID:-1000}:${SPIKE_GID:-1000}'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 384m
  cpus: 1
  tmpfs:
    - /tmp:uid=${SPIKE_UID:-1000},gid=${SPIKE_GID:-1000},mode=0700,size=32m,noexec,nosuid,nodev
    # s6-overlay executes its ephemeral init from /run; no extra capability is needed.
    - /run:uid=${SPIKE_UID:-1000},gid=${SPIKE_GID:-1000},mode=0755,size=16m,exec,nosuid,nodev
  environment:
    TZ: Etc/UTC
    WEBUI_PORT: '8080'
    TORRENTING_PORT: '6881'
    S6_READ_ONLY_ROOT: '1'
  healthcheck:
    test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:8080/]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  # Explicit loopback DNS prevents the Docker resolver from forwarding public queries.
  dns: [127.0.0.1]
  networks: [peers]
  restart: 'no'
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 2m
      max-file: '1'

services:
  seed:
    <<: *client
    volumes:
      - type: bind
        source: ${SPIKE_ROOT:?run the local initializer first}/seed-config
        target: /config
        bind: { create_host_path: false }
      - type: bind
        source: ${SPIKE_ROOT:?run the local initializer first}/seed-data
        target: /data
        read_only: true
        bind: { create_host_path: false }
  target:
    <<: *client
    volumes:
      - type: bind
        source: ${SPIKE_ROOT:?run the local initializer first}/target-config
        target: /config
        bind: { create_host_path: false }
      - type: bind
        source: ${SPIKE_ROOT:?run the local initializer first}/target-data
        target: /data
        bind: { create_host_path: false }

networks:
  peers:
    internal: true
    enable_ipv6: false
# No published ports, host network, Docker socket or permanent media mounts.
# API control uses docker compose exec; only these two peers can exchange fixture bytes.
