# Reference compose for the bb-homelab deployment (ADR-0013). The live copy lives in the
# bb-homelab repository; keep both in step. No app port is published: Caddy is the only
# entry point and reaches the app over its own proxy network (bb-homelab ADR 0009).
services:
  popcorntv:
    image: popcorntv:${POPCORNTV_VERSION:?set POPCORNTV_VERSION}
    container_name: bb-homelab-popcorntv
    env_file:
      - popcorntv.env
    environment:
      HOST: 0.0.0.0
      MEDIA_ROOT: /app/media
      PUBLIC_URL: https://popcorntv.bb-homelab.local
      # Caddy's fixed address on the proxy network (spec deploy-homelab R4).
      TRUST_PROXY: 10.203.60.2
      # Rebuildable caches live outside /app/data, which the nightly backup archives paused.
      ARTWORK_DIR: /app/cache/artwork
      TRANSCODE_DIR: /app/cache/transcode
    # Pattern Y bind mounts; create_host_path: false refuses to start when the HDD
    # (mounted with nofail) is missing, instead of writing to the SD card.
    volumes:
      - type: bind
        source: /mnt/appdata/popcorntv/data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/appdata/popcorntv/cache
        target: /app/cache
        bind:
          create_host_path: false
      # Interim media path until the media disk is mounted at /mnt/media (bb-homelab #47).
      - type: bind
        source: /mnt/appdata/media
        target: /app/media
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        ipv4_address: 10.203.60.3
    depends_on:
      web-sync:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: copies the web build of this image version into the volume Caddy serves, so
  # the web app and the API always come from the same image. Copies before pruning and keeps
  # older hashed assets 30 days, so an open tab can still load its lazy chunks after an
  # upgrade. -L stores files, never symlinks, in the volume Caddy serves.
  web-sync:
    image: popcorntv:${POPCORNTV_VERSION:?set POPCORNTV_VERSION}
    container_name: bb-homelab-popcorntv-web-sync
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mkdir -p /srv/web/assets
        && cp -RL /app/web/assets/. /srv/web/assets/
        && find /app/web -maxdepth 1 -type f -exec cp -L -t /srv/web/ {} +
        && test -f /srv/web/index.html
        && find /srv/web/assets -type f -mtime +30 -delete
    volumes:
      - popcorntv-web:/srv/web
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

# Both are created once by hand on the host and shared with the Caddy compose project
# (README, step 3), so either project can be torn down alone (bb-homelab ADR 0002, 0009).
networks:
  proxy:
    name: bb-homelab-proxy-popcorntv
    external: true

volumes:
  popcorntv-web:
    name: popcorntv-web
    external: true
