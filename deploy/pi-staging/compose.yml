# Pi staging only. Use start.sh to verify disk and Tailnet before Compose up.
name: popcorntv-pi-staging

x-app-image: &app-image ${PCTV_STAGE_IMAGE:?set the qualified ARM64 image ID}
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

services:
  popcorntv:
    image: *app-image
    platform: linux/arm64
    pull_policy: never
    env_file:
      - /mnt/appdata/popcorntv-staging/app.env
    environment:
      HOST: 0.0.0.0
      PUBLIC_URL: https://${PCTV_STAGE_HOST:?set the staging DNS name}:8443
      TRUST_PROXY: ${PCTV_STAGE_PROXY_IP:?set the dedicated bridge IP for Caddy}
      MEDIA_ROOT: /app/media
      ARTWORK_DIR: /app/cache/artwork
      TRANSCODE_DIR: /app/cache/transcode
    volumes:
      - type: bind
        source: /mnt/appdata/popcorntv-staging/data
        target: /app/data
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/appdata/popcorntv-staging/cache
        target: /app/cache
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/appdata/popcorntv-staging/media
        target: /app/media
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      web-sync:
        condition: service_completed_successfully
    networks: [stage]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 192
    logging: *logging
    restart: 'no'

  web-sync:
    image: *app-image
    platform: linux/arm64
    pull_policy: never
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        mkdir -p /srv/web/assets
        && cp -RL /app/web/assets/. /srv/web/assets/
        && find /app/web -maxdepth 1 -type f -exec cp -L -t /srv/web/ {} +
        && test -f /srv/web/index.html
        && test -f /srv/web/404.html
        && find /srv/web/assets -type f -mtime +30 -delete
    volumes:
      - type: bind
        source: /mnt/appdata/popcorntv-staging/web
        target: /srv/web
        bind: { create_host_path: false }
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 32
    logging: *logging
    restart: 'no'

  caddy:
    image: ${PCTV_STAGE_CADDY_IMAGE:?set the qualified ARM64 Caddy image ID}
    platform: linux/arm64
    pull_policy: never
    user: '1000:1000'
    environment:
      PCTV_STAGE_HOST: ${PCTV_STAGE_HOST:?set the staging DNS name}
    ports:
      - target: 8443
        published: '8443'
        protocol: tcp
        host_ip: ${PCTV_STAGE_TAILNET_IP:?set the verified Pi tailnet IPv4 address}
    volumes:
      - type: bind
        source: /mnt/appdata/popcorntv-staging/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/appdata/popcorntv-staging/web
        target: /srv/popcorntv-web
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/appdata/popcorntv-staging/caddy-data
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/appdata/popcorntv-staging/caddy-config
        target: /config
        bind: { create_host_path: false }
    networks:
      stage:
        ipv4_address: ${PCTV_STAGE_PROXY_IP:?set the dedicated bridge IP for Caddy}
    depends_on:
      popcorntv:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    restart: 'no'

networks:
  stage:
    ipam:
      config:
        - subnet: ${PCTV_STAGE_SUBNET:?set a checked non-overlapping bridge subnet}
