<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0b0d" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/not-found.css" />
    <title>Page not found — PopCornTV</title>
  </head>
  <body>
    <main class="not-found">
      <svg class="spill" viewBox="0 0 320 170" aria-hidden="true" focusable="false">
        <defs>
          <symbol id="kernel" viewBox="-10 -10 20 20">
            <circle class="spill__puff" cx="-3" cy="2" r="5" />
            <circle class="spill__puff" cx="3" cy="2" r="5" />
            <circle class="spill__puff" cx="0" cy="-3" r="5.5" />
            <circle class="spill__butter" cx="1" cy="3" r="2.5" />
          </symbol>
          <pattern
            id="stripes"
            width="20"
            height="20"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(-17)"
          >
            <rect class="spill__stripe-light" width="20" height="20" />
            <rect class="spill__stripe-red" width="20" height="10" />
          </pattern>
        </defs>
        <ellipse class="spill__shadow" cx="160" cy="152" rx="140" ry="10" />
        <g class="spill__box">
          <polygon points="40,118 150,78 150,152 40,152" fill="url(#stripes)" />
          <ellipse class="spill__mouth" cx="150" cy="115" rx="9" ry="37" />
          <use href="#kernel" x="150" y="96" width="22" height="22" />
          <use href="#kernel" x="156" y="120" width="24" height="24" />
        </g>
        <use href="#kernel" x="174" y="132" width="20" height="20" />
        <use href="#kernel" x="196" y="138" width="18" height="18" />
        <use href="#kernel" x="218" y="134" width="20" height="20" />
        <use href="#kernel" x="244" y="140" width="16" height="16" />
        <use href="#kernel" x="268" y="137" width="18" height="18" />
        <use href="#kernel" x="20" y="138" width="16" height="16" />
        <use href="#kernel" x="182" y="112" width="18" height="18" />
        <use class="spill__fly" href="#kernel" x="200" y="60" width="20" height="20" />
        <use
          class="spill__fly spill__fly--2"
          href="#kernel"
          x="240"
          y="30"
          width="18"
          height="18"
        />
        <use
          class="spill__fly spill__fly--3"
          href="#kernel"
          x="110"
          y="20"
          width="16"
          height="16"
        />
        <use
          class="spill__fly spill__fly--4"
          href="#kernel"
          x="280"
          y="80"
          width="14"
          height="14"
        />
      </svg>
      <p class="not-found__code">404</p>
      <h1 class="not-found__title">Page not found</h1>
      <p class="not-found__text">This address does not lead anywhere in PopCornTV.</p>
      <a class="not-found__home" href="/">Back to the catalog</a>
    </main>
  </body>
</html>
