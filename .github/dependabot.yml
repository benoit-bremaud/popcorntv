# Dependency updates: pnpm workspace, Python (uv), pinned GitHub Actions, Docker base images
# (application, local discovery and retrieval), compose images.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-bases: # digest-only refreshes have no SemVer level: group by name
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: docker
    directory: /deploy/local-discovery
    schedule:
      interval: weekly
    groups:
      docker-bases:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: docker-compose
    directory: /deploy/local-discovery
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: docker
    directory: /deploy/local-retrieval
    schedule:
      interval: weekly
    groups:
      docker-bases:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore(docker)
